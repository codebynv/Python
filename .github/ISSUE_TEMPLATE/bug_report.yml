name: Bug report
description: Report a reproducible Python exercise issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input or command used
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual output
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Python version
    validations:
      required: false
